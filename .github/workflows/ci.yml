name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-asyncio psutil pydantic fastapi aiohttp python-dotenv

      - name: Syntax check — Python
        run: |
          for f in agent/*.py agent/sensors/*.py homelab/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f"
          done

      - name: Syntax check — Bash
        run: |
          for f in scripts/adb/*.sh scripts/root/*.sh scripts/termux/*.sh cascade.sh; do
            bash -n "$f" && echo "OK: $f"
          done

      - name: Run tests
        run: python3 -m pytest tests/ -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: |
          if grep -rn "sk-ant-" --include="*.py" --include="*.sh" --include="*.yaml" .; then
            echo "BŁĄD: Znaleziono klucz Anthropic w kodzie!"; exit 1
          fi
          echo "OK: brak sekretów w kodzie"

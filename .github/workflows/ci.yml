name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pytest-asyncio psutil

      - name: Syntax check — Python
        run: |
          for f in agent/*.py homelab/*.py; do
            python3 -m py_compile "$f" && echo "OK: $f"
          done

      - name: Syntax check — Bash
        run: |
          for f in scripts/**/*.sh cascade.sh; do
            bash -n "$f" && echo "OK: $f"
          done

      - name: Run tests
        run: python3 -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for secrets in code
        run: |
          # Szukaj przypadkowych kluczy API w kodzie (nie w .env)
          if grep -r "sk-ant-" --include="*.py" .; then
            echo "BŁĄD: Znaleziono klucz Anthropic w kodzie!"
            exit 1
          fi
          echo "OK: brak sekretów w kodzie"
